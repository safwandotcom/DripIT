[pytest]
pythonpath = .
asyncio_mode = auto
# fastapi==0.110.0 pins starlette<0.37.0, and starlette's TestClient (up to
# 0.36.3) still constructs httpx.Client via the 'app=' shortcut that httpx
# 0.27.0 deprecated. This is a known third-party incompatibility between our
# two pinned versions, not a defect in our code — silence it narrowly rather
# than loosen either pin (which would touch Global Constraints other tasks
# were already reviewed against) or downgrade httpx (which bots.py,
# sheets_client.py, and image_engine.py already rely on at 0.27.0).
filterwarnings =
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
